name: Release

# A release is a pushed v* tag: this tests, publishes, packs with Velopack and uploads the
# installer, portable zip, update packages and SHA-256 sums to a GitHub Release.
# On a pull request that touches this file it is a dry run: it builds and packs as a
# 0.0.<run>-dryrun version, keeps the packages as a workflow artifact, and publishes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

env:
  # Must equal the Velopack package version in MtgaCollectionAdvisor.UI.csproj
  # (ReleaseWorkflowTests): the installer and the in-app updater move together.
  VPK_VERSION: 1.2.158
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}-dryrun" >> "$GITHUB_ENV"  # vpk refuses versions below 0.0.1
          fi

      - run: dotnet test MtgaCollectionAdvisor.slnx --configuration Release

      # The Windows app (#119): its own window, no local server. The same shape publish-local.ps1
      # builds, stamped with the release version.
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MtgaCollectionAdvisor.Desktop -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:Version="$VERSION" -o publish-out

      # Run what is about to ship and fail the release if it is broken: v0.1.1 loaded every page
      # with no button working and no error anywhere (#54). The window logs "Window rendered" once
      # Blazor has drawn it, and closing the window must stop the app.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "publish-out\MtgaDeckAdvisor.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $subsystem = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 0x18 + 0x44)
          if ($subsystem -ne 2) { throw "The exe would open a console window (PE subsystem $subsystem, expected 2)." }

          $smoke = "$env:RUNNER_TEMP\smoke"
          New-Item -ItemType Directory -Force $smoke | Out-Null
          $env:MTGA_ADVISOR_DB_PATH = "$smoke\advisor.db"
          $app = Start-Process $exe -PassThru
          try {
            $log = $null
            $rendered = $false
            for ($i = 0; $i -lt 60 -and -not $rendered; $i++) {
              Start-Sleep -Seconds 2
              if ($app.HasExited) { throw "The published app exited on its own (code $($app.ExitCode))." }
              $log = Get-ChildItem "$smoke\logs\advisor-*.log" -ErrorAction SilentlyContinue | Select-Object -First 1
              $rendered = $null -ne $log -and (Select-String -Path $log.FullName -Pattern "Window rendered" -Quiet)
            }
            if (-not $rendered) {
              if ($log) { Get-Content $log.FullName }
              throw "The published app never drew its window."
            }
            "Window rendered"

            $app.Refresh()
            $app.CloseMainWindow() | Out-Null
            if (-not $app.WaitForExit(15000)) { throw "The app did not stop after its window closed." }
            if (-not (Select-String -Path $log.FullName -Pattern "Stopping: window closed" -Quiet)) {
              Get-Content $log.FullName
              throw "The app stopped without logging why."
            }
            "Stopping: window closed"
          }
          finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force } }

      # Global tools land in %USERPROFILE%\.dotnet\tools, which later steps' PATH lacks.
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Delta packages are built against the previous release; the first release has none.
      - name: Previous release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh release list --repo "${{ github.repository }}" --limit 1)" ]; then
            vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" -o Releases
          fi

      # packId is not the data folder's name (MtgaCollectionAdvisor): uninstalling deletes
      # %LOCALAPPDATA%\<packId>, and the player's data must survive that. The installer adds
      # WebView2 where it is missing (Windows 11 has it, some Windows 10 machines don't).
      - name: Pack
        shell: bash
        run: |
          vpk pack --packId MtgaDeckAdvisor --packVersion "$VERSION" --packDir publish-out \
            --mainExe MtgaDeckAdvisor.exe --framework webview2 --packTitle "MTGA Deck Advisor" \
            --packAuthors "Dasayeve" --icon src/MtgaCollectionAdvisor.Desktop/app.ico --runtime win-x64 -o Releases
          cd Releases && sha256sum *Setup.exe *Portable.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Dry-run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: Releases/

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" -o Releases \
            --publish --tag "$GITHUB_REF_NAME" --releaseName "MTGA Deck Advisor $VERSION"

      - name: Notes and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" Releases/SHA256SUMS.txt --repo "${{ github.repository }}"
          notes=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          printf '%s\n\n## SHA-256\n\n```\n%s\n```\n' "$notes" "$(cat Releases/SHA256SUMS.txt)" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "${{ github.repository }}"

  # Artifact only, on tags too: with no Apple signing identity an unsigned .pkg is refused by
  # Gatekeeper (ReleaseWorkflowTests holds this). To publish, sign in Pack (--signAppIdentity,
  # --signEntitlements with the debugger entitlement, --notaryProfile) and upload on tags.
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}-dryrun" >> "$GITHUB_ENV"  # vpk refuses versions below 0.0.1
          fi

      # The solution holds the Windows app, which doesn't build here.
      - run: dotnet test src/MtgaCollectionAdvisor.Core.Tests --configuration Release

      - name: Publish (macOS)
        shell: bash
        run: |
          dotnet publish src/MtgaCollectionAdvisor.Web -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:Version="$VERSION" -o publish-out
          rm -f publish-out/appsettings.Development.json

      - name: Smoke test (macOS)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          MTGA_ADVISOR_PORT=5299 MTGA_ADVISOR_DB_PATH="$RUNNER_TEMP/smoke/advisor.db" \
            ./publish-out/MtgaCollectionAdvisor.Web --no-browser &
          app=$!
          trap 'kill -9 $app 2>/dev/null || true' EXIT
          up=false
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5299/; then up=true; break; fi
            sleep 2
          done
          if [ "$up" != true ]; then echo "The published app did not answer on port 5299."; exit 1; fi
          for path in / /_framework/blazor.web.js /_content/MtgaCollectionAdvisor.UI/app.css; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5299$path")
            echo "GET $path -> $status"
            if [ "$status" != 200 ]; then echo "GET $path returned $status."; exit 1; fi
          done

      - name: Icon (macOS)
        shell: bash
        run: |
          src=src/MtgaCollectionAdvisor.Web/wwwroot/icon-512.png
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "app.iconset/icon_${s}x${s}.png" > /dev/null
            if [ $((s * 2)) -le 512 ]; then
              sips -z $((s * 2)) $((s * 2)) "$src" --out "app.iconset/icon_${s}x${s}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns app.iconset -o app.icns

      - name: Install vpk (macOS)
        shell: bash
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack (macOS)
        shell: bash
        run: |
          vpk pack --packId MtgaDeckAdvisor --packVersion "$VERSION" --packDir publish-out \
            --mainExe MtgaCollectionAdvisor.Web --packTitle "MTGA Deck Advisor" \
            --packAuthors "Dasayeve" --bundleId com.dasayeve.mtgadeckadvisor --icon app.icns \
            --runtime osx-arm64 -o Releases-macos
          ls -l Releases-macos

      - name: macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Releases-macos/
