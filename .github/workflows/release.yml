name: Release

# A release is a pushed v* tag: this tests, publishes, packs with Velopack and uploads the
# installer, portable zip, update packages and SHA-256 sums to a GitHub Release.
# On a pull request that touches this file it is a dry run: it builds and packs as a
# 0.0.<run>-dryrun version, keeps the packages as a workflow artifact, and publishes nothing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: write

env:
  # Must equal the Velopack package version in MtgaCollectionAdvisor.Web.csproj
  # (ReleaseWorkflowTests): the installer and the in-app updater move together.
  VPK_VERSION: 1.2.158
  REPO_URL: https://github.com/${{ github.repository }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}-dryrun" >> "$GITHUB_ENV"  # vpk refuses versions below 0.0.1
          fi

      - run: dotnet test MtgaCollectionAdvisor.slnx --configuration Release

      # The same shape publish-local.ps1 builds, stamped with the release version, and with no
      # console window (WindowsAppNoConsole; see the Web project file).
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/MtgaCollectionAdvisor.Web -c Release -r win-x64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:Version="$VERSION" -p:WindowsAppNoConsole=true -o publish-out
          rm -f publish-out/appsettings.Development.json

      # v0.1.1 shipped with blazor.web.js missing: every page loaded and no button worked, with
      # no error anywhere (#54). Run what is about to ship and fail the release if it is broken.
      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "publish-out\MtgaCollectionAdvisor.Web.exe"
          $bytes = [IO.File]::ReadAllBytes($exe)
          $subsystem = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3C) + 0x18 + 0x44)
          if ($subsystem -ne 2) { throw "The exe would open a console window (PE subsystem $subsystem, expected 2)." }

          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\smoke" | Out-Null
          $env:MTGA_ADVISOR_PORT = "5299"
          $env:MTGA_ADVISOR_DB_PATH = "$env:RUNNER_TEMP\smoke\advisor.db"
          $app = Start-Process $exe -ArgumentList "--no-browser" -PassThru
          try {
            $up = $false
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              try { Invoke-WebRequest "http://localhost:5299/" -UseBasicParsing | Out-Null; $up = $true }
              catch { Start-Sleep -Seconds 2 }
            }
            if (-not $up) { throw "The published app did not answer on port 5299." }
            foreach ($path in "/", "/_framework/blazor.web.js", "/app.css") {
              $status = (Invoke-WebRequest "http://localhost:5299$path" -UseBasicParsing -SkipHttpErrorCheck).StatusCode
              if ($status -ne 200) { throw "GET $path returned $status." }
              "GET $path -> $status"
            }
          }
          finally { Stop-Process -Id $app.Id -Force }

      # Global tools land in %USERPROFILE%\.dotnet\tools, which later steps' PATH lacks.
      - name: Install vpk
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Delta packages are built against the previous release; the first release has none.
      - name: Previous release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh release list --repo "${{ github.repository }}" --limit 1)" ]; then
            vpk download github --repoUrl "$REPO_URL" --token "$GH_TOKEN" -o Releases
          fi

      # packId is not the data folder's name (MtgaCollectionAdvisor): uninstalling deletes
      # %LOCALAPPDATA%\<packId>, and the player's data must survive that.
      - name: Pack
        shell: bash
        run: |
          vpk pack --packId MtgaDeckAdvisor --packVersion "$VERSION" --packDir publish-out \
            --mainExe MtgaCollectionAdvisor.Web.exe --packTitle "MTGA Deck Advisor" \
            --packAuthors "Dasayeve" --icon src/MtgaCollectionAdvisor.Web/app.ico --runtime win-x64 -o Releases
          cd Releases && sha256sum *Setup.exe *Portable.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Dry-run artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run
          path: Releases/

      - name: Upload release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          vpk upload github --repoUrl "$REPO_URL" --token "${{ secrets.GITHUB_TOKEN }}" -o Releases \
            --publish --tag "$GITHUB_REF_NAME" --releaseName "MTGA Deck Advisor $VERSION"

      - name: Notes and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" Releases/SHA256SUMS.txt --repo "${{ github.repository }}"
          notes=$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          printf '%s\n\n## SHA-256\n\n```\n%s\n```\n' "$notes" "$(cat Releases/SHA256SUMS.txt)" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "${{ github.repository }}"

  # Artifact only, on tags too: with no Apple signing identity an unsigned .pkg is refused by
  # Gatekeeper (ReleaseWorkflowTests holds this). To publish, sign in Pack (--signAppIdentity,
  # --signEntitlements with the debugger entitlement, --notaryProfile) and upload on tags.
  release-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}-dryrun" >> "$GITHUB_ENV"  # vpk refuses versions below 0.0.1
          fi

      - run: dotnet test MtgaCollectionAdvisor.slnx --configuration Release

      - name: Publish (macOS)
        shell: bash
        run: |
          dotnet publish src/MtgaCollectionAdvisor.Web -c Release -r osx-arm64 --self-contained \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None -p:Version="$VERSION" -o publish-out
          rm -f publish-out/appsettings.Development.json

      - name: Smoke test (macOS)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          MTGA_ADVISOR_PORT=5299 MTGA_ADVISOR_DB_PATH="$RUNNER_TEMP/smoke/advisor.db" \
            ./publish-out/MtgaCollectionAdvisor.Web --no-browser &
          app=$!
          trap 'kill -9 $app 2>/dev/null || true' EXIT
          up=false
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:5299/; then up=true; break; fi
            sleep 2
          done
          if [ "$up" != true ]; then echo "The published app did not answer on port 5299."; exit 1; fi
          for path in / /_framework/blazor.web.js /app.css; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:5299$path")
            echo "GET $path -> $status"
            if [ "$status" != 200 ]; then echo "GET $path returned $status."; exit 1; fi
          done

      - name: Icon (macOS)
        shell: bash
        run: |
          src=src/MtgaCollectionAdvisor.Web/wwwroot/icon-512.png
          mkdir -p app.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "app.iconset/icon_${s}x${s}.png" > /dev/null
            if [ $((s * 2)) -le 512 ]; then
              sips -z $((s * 2)) $((s * 2)) "$src" --out "app.iconset/icon_${s}x${s}@2x.png" > /dev/null
            fi
          done
          iconutil -c icns app.iconset -o app.icns

      - name: Install vpk (macOS)
        shell: bash
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Pack (macOS)
        shell: bash
        run: |
          vpk pack --packId MtgaDeckAdvisor --packVersion "$VERSION" --packDir publish-out \
            --mainExe MtgaCollectionAdvisor.Web --packTitle "MTGA Deck Advisor" \
            --packAuthors "Dasayeve" --bundleId com.dasayeve.mtgadeckadvisor --icon app.icns \
            --runtime osx-arm64 -o Releases-macos
          ls -l Releases-macos

      - name: macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Releases-macos/
